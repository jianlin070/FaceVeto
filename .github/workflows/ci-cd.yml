name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WIF_PROVIDER: projects/387046116425/locations/global/workloadIdentityPools/github/providers/faceveto-repo
  DEPLOYER: github-deployer@faceveto-2026.iam.gserviceaccount.com
  RUNTIME_SA: faceveto-api@faceveto-2026.iam.gserviceaccount.com
  LIVE_URL: https://faceveto.web.app

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
              - 'firebase.json'

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - run: pytest -q
        working-directory: api

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build # type check + production build
        working-directory: web

  # Deploys run only from main, only for the parts that changed (Run workflow on main redeploys both). A running deploy is never
  # cancelled; newer pushes wait and only the latest waiting one deploys.
  deploy-api:
    needs: [changes, test-api, test-web]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.api == 'true'))
    runs-on: ubuntu-latest
    concurrency: { group: deploy-api, cancel-in-progress: false }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: make deploy-api

  deploy-web:
    needs: [changes, test-api, test-web, deploy-api]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.web == 'true'))
      && needs.test-api.result == 'success' && needs.test-web.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency: { group: deploy-web, cancel-in-progress: false }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm install -g firebase-tools@15.34.0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - run: make deploy-web

  live-check:
    needs: [deploy-api, deploy-web]
    if: >-
      always() && (needs.deploy-api.result == 'success' || needs.deploy-web.result == 'success')
      && needs.deploy-api.result != 'failure' && needs.deploy-web.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$LIVE_URL/api/healthz"
          curl -fsS --retry 3 --retry-delay 5 "$LIVE_URL/" | grep -q '<div id="root">'

  # Full end-to-end run after backend deploys. Uses dedicated test accounts and LFW faces,
  # cleans up after itself. Runs as the API's runtime account to manage the test accounts.
  e2e:
    needs: [deploy-api, live-check]
    if: always() && needs.deploy-api.result == 'success' && needs.live-check.result == 'success'
    runs-on: ubuntu-latest
    concurrency: { group: e2e, cancel-in-progress: false }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: eval/.cache
          key: lfw-v1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RUNTIME_SA }}
      - run: python scripts/e2e_demo.py
        env:
          FACEVETO_URL: ${{ env.LIVE_URL }}
          LOAD_FACE_MODEL: 'false'
